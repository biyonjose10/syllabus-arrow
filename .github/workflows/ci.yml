name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # `next build` imports every route, and Better Auth touches the lazy Prisma
      # client at import. A placeholder URL keeps that quiet; no step connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
